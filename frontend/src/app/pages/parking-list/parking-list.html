<div class="bg-gray-50 min-h-screen pb-12">

  <!-- 🔎 SEARCH -->
  <div class="bg-white py-16 px-4 text-center shadow-sm mb-8">
    <h1 class="text-4xl font-extrabold mb-6">
      Znajdź wolne miejsce w ułamku sekundy
    </h1>

    <div class="max-w-2xl mx-auto flex gap-2">
      <input
        [(ngModel)]="search"
        (keyup.enter)="onSearch()"
        placeholder="Szukaj miasta lub ulicy..."
        class="w-full px-4 py-3 border rounded-md"
      />

      <button (click)="onSearch()" class="bg-blue-600 text-white px-6 rounded-md">
        Szukaj
      </button>
    </div>
  </div>

  <!-- 🔁 VIEW SWITCH -->
  <div class="flex justify-center mb-6 gap-4">
    <button (click)="widokMapy = false; pobierzParkingi()"
      class="px-6 py-3 rounded-full border"
      [class.bg-blue-600]="!widokMapy"
      [class.text-white]="!widokMapy">
      Lista
    </button>

    <button (click)="przelaczWidokMapy()"
      class="px-6 py-3 rounded-full border"
      [class.bg-blue-600]="widokMapy"
      [class.text-white]="widokMapy">
      Mapa
    </button>
  </div>

  <!-- 🗺 MAPA -->
  <div [class.hidden]="!widokMapy" class="max-w-7xl mx-auto px-4">
    <div id="parking-map" class="h-[600px] rounded-xl shadow"></div>
  </div>

  <!-- 📄 LISTA -->
  <div *ngIf="!widokMapy" class="max-w-7xl mx-auto px-4">

    <div *ngIf="parkingi.length === 0" class="text-center text-gray-500">
      Brak parkingów
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let p of parkingi" class="bg-white p-5 rounded-xl shadow">

        <h3 class="font-bold text-lg">{{ p.nazwa }}</h3>
        <p class="text-sm text-gray-500">{{ p.adres }}</p>

        <div class="flex justify-between mt-3">
          <span>{{ p.cenaZaGodzine }} PLN/h</span>
          <span class="font-bold text-green-600">
            {{ p.wolneMiejsca }} wolnych
          </span>
        </div>

        <button (click)="sprawdzLogowanieIPrzejdz(p._id)"
          class="w-full mt-4 bg-blue-600 text-white py-2 rounded">
          Rezerwuj
        </button>
      </div>
    </div>

    <!-- 📄 PAGINACJA -->
    <div class="flex justify-center mt-8 gap-4">
      <button (click)="prevPage()" class="px-4 py-2 border rounded">
        Poprzednia
      </button>

      <span class="px-4 py-2">
        Strona {{ page }} / {{ totalPages }}
      </span>

      <button (click)="nextPage()" class="px-4 py-2 border rounded">
        Następna
      </button>
    </div>

  </div>
</div>
