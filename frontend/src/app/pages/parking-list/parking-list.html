<div class="bg-gray-50 min-h-screen">
  <div class="bg-white py-16 px-4 text-center shadow-sm">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-6">
      Znajdź wolne miejsce w ułamku sekundy
    </h1>
    
    <div class="max-w-2xl mx-auto flex gap-2">
      <div class="relative flex-grow">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text" placeholder="Szukaj" 
               class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button class="bg-blue-600 text-white px-8 py-3 rounded-md font-semibold hover:bg-blue-700 transition">
        Szukaj
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto py-12 px-4">
    <div *ngIf="parkingi.length === 0" class="text-center text-gray-500 py-10">
      Brak dostępnych parkingów w bazie danych. Dodaj jakiś, aby go tutaj zobaczyć!
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <div *ngFor="let p of parkingi" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 hover:shadow-lg transition">
        <div class="p-5">
          <h3 class="text-lg font-bold text-gray-900">{{ p.nazwa }}</h3>
          <p class="text-gray-500 text-sm mb-4">{{ p.adres }}</p>
          
          <div class="flex items-center justify-between mb-4">
            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded">
              Podziemny
            </span>
            <span class="text-gray-900 font-bold">{{ p.cenaZaGodzine }} PLN / h</span>
          </div>
          
          <p class="text-green-600 text-sm font-medium mb-5">
            Wolne miejsca: {{ p.wolneMiejsca }} / {{ p.liczbaMiejsc }}
          </p>
          
          <button (click)="sprawdzLogowanieIPrzejdz(p._id)" 
                  class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
            Rezerwuj
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
