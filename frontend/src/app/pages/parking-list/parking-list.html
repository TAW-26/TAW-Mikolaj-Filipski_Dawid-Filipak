<div class="p-8 max-w-6xl mx-auto">
  <h1 class="text-3xl font-bold mb-6">Dostępne parkingi</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let parking of parkingi" class="border rounded-lg p-6 shadow-sm hover:shadow-md transition">
      <h2 class="text-xl font-semibold">{{parking.nazwa}}</h2>
      <p class="text-gray-600 mb-2">{{parking.adres}}</p>
      <div class="flex justify-between items-center mb-4">
        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">
          {{parking.typ}}
        </span>
        <span class="font-bold">{{parking.cenaZaGodzine}} PLN / h</span>
      </div>
      <p class="text-sm mb-4" [ngClass]="parking.wolneMiejsca > 0 ? 'text-green-600' : 'text-red-600'">
        Wolne miejsca: {{parking.wolneMiejsca}}
      </p>
      <a [routerLink]="['/parking', parking._id]"
         class="block w-full text-center bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Rezerwuj
      </a>
    </div>
  </div>
</div>
