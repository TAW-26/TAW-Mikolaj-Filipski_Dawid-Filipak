<div class="p-8 max-w-6xl mx-auto flex gap-8">
  <div class="w-1/4 bg-white border rounded-lg p-4 h-fit shadow-sm">
    <h3 class="font-bold text-lg mb-4">Panel Użytkownika</h3>
    <ul class="flex flex-col gap-2">
      <li class="bg-blue-50 text-blue-700 font-medium p-2 rounded cursor-pointer">Moje Rezerwacje</li>
      <li class="hover:bg-gray-100 p-2 rounded cursor-pointer text-gray-700">Moje Pojazdy</li>
      <li class="hover:bg-gray-100 p-2 rounded cursor-pointer text-gray-700">Ustawienia</li>
    </ul>
  </div>

  <div class="w-3/4">
    <h2 class="text-2xl font-bold mb-6">Twoje Rezerwacje</h2>
    <div class="bg-white border rounded-lg overflow-hidden shadow-sm">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-100 border-b">
            <th class="p-4">Parking</th>
            <th class="p-4">Od</th>
            <th class="p-4">Do</th>
            <th class="p-4">Status</th>
            <th class="p-4">Koszt</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rez of rezerwacje" class="border-b last:border-0 hover:bg-gray-50">
            <td class="p-4 font-medium">{{rez.parkingId?.nazwa}}</td>
            <td class="p-4">{{formatDate(rez.dataOd)}}</td>
            <td class="p-4">{{formatDate(rez.dataDo)}}</td>
            <td class="p-4">
              <span class="px-2 py-1 rounded text-xs font-bold"
                [ngClass]="{
                  'bg-green-100 text-green-800': rez.status === 'aktywna',
                  'bg-red-100 text-red-800': rez.status === 'anulowana',
                  'bg-gray-100 text-gray-800': rez.status !== 'aktywna' && rez.status !== 'anulowana'
                }">
                {{rez.status.toUpperCase()}}
              </span>
            </td>
            <td class="p-4 font-bold">{{rez.koszt}} PLN</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
