<div class="max-w-7xl mx-auto py-10 px-4 flex gap-8">
  <div class="w-64 bg-white p-6 rounded-xl shadow-md h-fit">
    <h3 class="font-bold text-lg mb-6">Panel Użytkownika</h3>
    <ul class="space-y-2">
      <li>
        <button (click)="activeTab = 'rezerwacje'" 
                [class.bg-blue-50]="activeTab === 'rezerwacje'"
                class="w-full text-left p-3 rounded-lg font-medium transition hover:bg-gray-50">
          Moje Rezerwacje
        </button>
      </li>
      <li>
        <button (click)="activeTab = 'pojazdy'" 
                [class.bg-blue-50]="activeTab === 'pojazdy'"
                class="w-full text-left p-3 rounded-lg font-medium transition hover:bg-gray-50">
          Moje Pojazdy
        </button>
      </li>
      <li>
        <button (click)="activeTab = 'ustawienia'" 
                [class.bg-blue-50]="activeTab === 'ustawienia'"
                class="w-full text-left p-3 rounded-lg font-medium transition hover:bg-gray-50">
          Ustawienia
        </button>
      </li>
    </ul>
  </div>

  <div class="flex-grow bg-white p-8 rounded-xl shadow-md">
    
    <div *ngIf="activeTab === 'rezerwacje'">
      <h2 class="text-2xl font-bold mb-6">Twoje Rezerwacje</h2>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 text-gray-600 uppercase text-xs">
            <th class="p-4">Parking</th>
            <th class="p-4">Od</th>
            <th class="p-4">Do</th>
            <th class="p-4">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rezerwacje" class="border-b">
            <td class="p-4 font-medium">{{ r.parkingId?.nazwa }}</td>
            <td class="p-4 text-sm">{{ formatDate(r.dataOd) }}</td>
            <td class="p-4 text-sm">{{ formatDate(r.dataDo) }}</td>
            <td class="p-4"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">Aktywna</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="activeTab === 'pojazdy'">
      <h2 class="text-2xl font-bold mb-6">Moje Pojazdy</h2>
      <div class="grid grid-cols-2 gap-4 mb-8">
        <div *ngFor="let v of pojazdy" class="border p-4 rounded-lg flex justify-between items-center">
          <div>
            <p class="font-bold">{{ v.marka }} {{ v.model }}</p>
            <p class="text-gray-500">{{ v.nrRejestracyjny }}</p>
          </div>
          <button class="text-red-500 hover:underline">Usuń</button>
        </div>
      </div>
      <div class="bg-gray-50 p-6 rounded-xl">
        <h3 class="font-bold mb-4">Dodaj nowy pojazd</h3>
        <div class="flex gap-2">
          <input [(ngModel)]="nowyPojazd.marka" placeholder="Marka" class="border p-2 rounded flex-grow">
          <input [(ngModel)]="nowyPojazd.model" placeholder="Model" class="border p-2 rounded flex-grow">
          <input [(ngModel)]="nowyPojazd.nrRejestracyjny" placeholder="Nr rej." class="border p-2 rounded flex-grow">
          <button (click)="dodajPojazd()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">Dodaj</button>
        </div>
      </div>
    </div>

    <div *ngIf="activeTab === 'ustawienia'">
      <h2 class="text-2xl font-bold mb-6">Ustawienia Konta</h2>
      <button class="bg-red-100 text-red-600 px-6 py-2 rounded-lg font-bold hover:bg-red-200 transition">
        Wyloguj się
      </button>
    </div>

  </div>
</div>
