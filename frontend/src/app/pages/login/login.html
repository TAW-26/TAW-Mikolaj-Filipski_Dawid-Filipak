<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <h2 class="text-center text-3xl font-extrabold text-gray-900">Zaloguj się</h2>
    <div class="rounded-md shadow-sm space-y-4">
      <input [(ngModel)]="credentials.email" type="email" placeholder="Email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      
      <input [(ngModel)]="credentials.haslo" type="password" placeholder="Hasło" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button (click)="handleLogin()" class="w-full py-3 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">Wejdź</button>
    <p class="text-center text-sm text-gray-600">Nie masz konta? <a routerLink="/register" class="text-blue-600 font-bold">Zarejestruj się</a></p>
  </div>
</div>
