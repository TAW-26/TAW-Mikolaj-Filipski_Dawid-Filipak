<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <h2 class="text-center text-3xl font-extrabold text-gray-900">Stwórz konto</h2>
    <div class="space-y-4">
      <input [(ngModel)]="userData.imie" type="text" placeholder="Imię" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <input [(ngModel)]="userData.email" type="email" placeholder="Email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <input [(ngModel)]="userData.password" type="password" placeholder="Hasło" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button (click)="handleRegister()" class="w-full py-3 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">Zarejestruj</button>
    <p class="text-center text-sm text-gray-600">Masz już konto? <a routerLink="/login" class="text-blue-600 font-bold">Zaloguj się</a></p>
  </div>
</div>
